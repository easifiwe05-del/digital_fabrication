# Replace the text below to customize your site
site_name: Emmanuel ASIFIWE
site_description: Your name Fabricademy site
site_author: Your name
copyright: Copyright 2025 Emmanuel ASIFIWE

site_url: https://easifiwe05-del.github.io/digital_fabrication/
repo_url: https://github.com/easifiwe05-del/digital_fabrication
repo_name: digital_fabrication

docs_dir: docs

extra:
  social:
    # Change to your own social media or remove line to hide. 
    # For more social icons ideas at https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#social-links
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/fablab_rwanda
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/KigaliFabLab
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/fablabrw

theme:
  # The name of the theme, needs to match your requirements.txt file
  name: material
  # Material theme options:
  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    # See available fonts from https://fonts.google.com/
    text: Montserrat
    code: Roboto Mono
  icon:
    # Read about icons at https://squidfunk.github.io/mkdocs-material/setup/changing-the-logo-and-icons/
    logo: material/library
    repo: material/gitlab
  features:
    - navigation.tabs
    - navigation.footer

# Read more here https://squidfunk.github.io/mkdocs-material/customization/#additional-css 
extra_css:
  - stylesheets/extra.css

# extra_javascript:
#   - 'javascript/extra.js'

plugins:
  - search
  - glightbox:
  - git-revision-date:
      enabled_if_env: CI

# See more extensions at https://squidfunk.github.io/mkdocs-material/reference/
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  # https://squidfunk.github.io/mkdocs-material/reference/admonitions/
  - pymdownx.details
  # https://squidfunk.github.io/mkdocs-material/reference/content-tabs/
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.superfences
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - meta
